name: Docker Build

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            pocketmind/backend:latest
            pocketmind/backend:${{ github.sha }}
          cache-from: type=registry,ref=pocketmind/backend:buildcache
          cache-to: type=registry,ref=pocketmind/backend:buildcache,mode=max
      
      - name: Build and push ai-worker
        uses: docker/build-push-action@v5
        with:
          context: ./ai-worker
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            pocketmind/ai-worker:latest
            pocketmind/ai-worker:${{ github.sha }}
          cache-from: type=registry,ref=pocketmind/ai-worker:buildcache
          cache-to: type=registry,ref=pocketmind/ai-worker:buildcache,mode=max

