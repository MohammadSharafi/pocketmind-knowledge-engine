spring:
  application:
    name: pocketmind-backend
  
  datasource:
    url: jdbc:postgresql://localhost:5432/pocketmind
    username: pocketmind
    password: pocketmind
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  
  mvc:
    async:
      request-timeout: 30000
  
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  
  graphql:
    graphiql:
      enabled: true
      path: /graphiql
    schema:
      printer:
        enabled: true

minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: pocketmind-files

ai-worker:
  base-url: http://localhost:8000

server:
  port: 8080

logging:
  level:
    com.pocketmind: DEBUG
    org.springframework.graphql: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{requestId}] %logger{36} - %msg%n"

